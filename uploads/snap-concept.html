<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General Eclectic — Intelligence for Artistry</title>
  <meta name="description" content="G.E. Creative Infrastructures — Intelligence for Artistry.">

  <!-- Open Graph -->
  <meta property="og:title" content="General Eclectic">
  <meta property="og:description" content="Intelligence for Artistry.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://generaleclectic.company">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Serif:ital,wght@0,400;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1B4332;
      color: #ffffff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* ═══ HERO ═══ */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 56px;
      overflow: hidden;
    }

    .hero-eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #F0B429;
      margin-bottom: 32px;
    }

    .hero h1 {
      font-size: clamp(4.5rem, 13vw, 11rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.9;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .hero-tagline {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.2rem, 2.5vw, 1.7rem);
      color: #F0B429;
      margin-bottom: 48px;
    }

    /* GE watermark */
    .hero-watermark {
      position: absolute;
      right: -2vw;
      bottom: -4vh;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: clamp(20rem, 40vw, 50rem);
      font-weight: 800;
      line-height: 0.75;
      color: rgba(255,255,255,0.04);
      pointer-events: none;
      letter-spacing: -0.06em;
      user-select: none;
    }

    /* ═══ CONTENT ═══ */
    .content {
      position: relative;
      z-index: 2;
      padding: 0 56px 80px;
      max-width: 800px;
    }

    /* Property cards */
    .property-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }
    .property-link:hover .arrow {
      transform: translateX(4px);
      opacity: 1;
    }
    .arrow {
      display: inline-block;
      font-weight: 400;
      color: rgba(255,255,255,0.3);
      opacity: 0.6;
      transition: transform 0.25s ease, opacity 0.25s ease;
      margin-left: 4px;
    }
    .property {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding: 28px 0;
      transition: border-color 0.25s ease;
    }
    .property:hover {
      border-top-color: rgba(255,255,255,0.25);
    }

    .property-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .property-label {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
    }

    .status {
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 3px 8px;
    }

    .status--active {
      color: #34D399;
      background: rgba(52, 211, 153, 0.1);
    }

    .status--product {
      color: #F0B429;
      background: rgba(240, 180, 41, 0.1);
    }

    .property-name {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .property-tagline {
      font-family: 'IBM Plex Serif', Georgia, serif;
      font-style: italic;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.35);
      line-height: 1.55;
    }

    .property-tools {
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-link {
      display: inline-block;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #F0B429;
      background: rgba(240, 180, 41, 0.07);
      border: 1px solid rgba(240, 180, 41, 0.18);
      border-radius: 4px;
      padding: 4px 10px;
      text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .tool-link:hover {
      background: rgba(240, 180, 41, 0.14);
      border-color: rgba(240, 180, 41, 0.35);
    }

    /* Now Playing — low key */
    .now-playing {
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .np-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .np-label {
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.15);
      font-weight: 600;
    }
    .np-listen {
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.2);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .np-listen:hover { color: rgba(255,255,255,0.45); }

    .player-wrap {
      opacity: 0.45;
      transition: opacity 0.4s ease;
    }
    .player-wrap:hover { opacity: 0.85; }

    /* Footer */
    footer {
      margin-top: 56px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    footer span {
      color: rgba(255,255,255,0.12);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    footer .domain {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ═══ RESPONSIVE ═══ */
    @media (max-width: 768px) {
      .hero { padding: 60px 28px; }
      .content { padding: 0 28px 60px; }
      .hero-watermark { font-size: 40vw; right: -5vw; bottom: -2vh; }
    }
    @media (max-width: 480px) {
      .hero { padding: 48px 20px; }
      .content { padding: 0 20px 48px; }
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-eyebrow">G.E. Creative Infrastructures</div>
    <h1>General<br>Eclectic</h1>
    <div class="hero-tagline">Intelligence for Artistry.</div>
    <div class="hero-watermark">GE</div>
  </section>

  <!-- CONTENT -->
  <div class="content">
    <a class="property-link" href="/maya">
      <div class="property">
        <div class="property-meta">
          <span class="property-label">001</span>
          <span class="status status--product">LLM</span>
        </div>
        <div class="property-name">MAYA <span class="arrow">→</span></div>
        <p class="property-tagline">The science of what makes culture move</p>
      </div>
    </a>

    <a class="property-link" href="/artiste">
      <div class="property">
        <div class="property-meta">
          <span class="property-label">002</span>
          <span class="status status--product">Product</span>
        </div>
        <div class="property-name">artiste.md <span class="arrow">→</span></div>
        <p class="property-tagline">Your creative DNA, on disk</p>
        <div class="property-tools">
          <a href="/signal" class="tool-link" onclick="event.stopPropagation();">signal</a>
        </div>
      </div>
    </a>

    <!-- Now Playing -->
    <section class="now-playing">
      <div class="np-meta">
        <span class="np-label">Now Playing</span>
        <a class="np-listen" href="https://untitled.stream/Rf9kWME5ZdIE" target="_blank" rel="noopener">Listen ↗</a>
      </div>
      <div class="player-wrap">
        <iframe
          style="border-radius: 12px; display:block;"
          src="https://untitled.stream/embed/Rf9kWME5ZdIE"
          width="100%" height="344"
          allowFullScreen
          allow="picture-in-picture"
          frameborder="0"
          loading="lazy"></iframe>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <span>© 2026 G.E. Creative Infrastructures</span>
      <span class="domain">generaleclectic.company</span>
    </footer>
  </div>

</body>
</html>
