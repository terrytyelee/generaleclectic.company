<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>General Eclectic — Hit Science for Artists</title>
<meta name="description" content="General Eclectic. We have figured out the science of hits. A creative infrastructure company for the Infinite Age." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/shared.jsx"></script>
<script type="text/babel" src="components/maya.jsx"></script>
<script type="text/babel" src="components/intro-film.jsx"></script>
<script type="text/babel" src="components/intro.jsx"></script>
<script type="text/babel" src="components/agent-prototypes.jsx"></script>
<script type="text/babel" src="components/landing.jsx"></script>
<script type="text/babel" src="components/roster.jsx"></script>
<script type="text/babel" src="components/apply.jsx"></script>
<script type="text/babel" src="components/portal.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [page, setPage] = useState("home");
  const [drawer, setDrawer] = useState(false);
  const [intro, setIntro] = useState(() => {
    try { return sessionStorage.getItem("ge_intro_seen") !== "1"; } catch (e) { return true; }
  });

  // route to top on page change
  useEffect(() => { window.scrollTo({ top: 0 }); }, [page]);

  const go = (p) => { setPage(p); setDrawer(false); };
  const closeIntro = () => {
    setIntro(false);
    try { sessionStorage.setItem("ge_intro_seen", "1"); } catch (e) {}
  };
  const openIntro = () => setIntro(true);

  return (
    <div className="app">
      <IntroOverlay open={intro} onClose={closeIntro} />
      <Ticker />
      <TopBar page={page} setPage={go} openDrawer={() => setDrawer(true)} />
      <Drawer open={drawer} onClose={() => setDrawer(false)} page={page} setPage={go} />
      {page === "home"   && <Landing setPage={go} openIntro={openIntro} />}
      {page === "roster" && <Roster setPage={go} />}
      {page === "apply"  && <Apply setPage={go} />}
      {page === "portal" && <Portal setPage={go} />}
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
